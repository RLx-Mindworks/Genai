openapi: 3.0.0
info:
  title: Project Management API
  version: 1.0.0
paths:
  /users:
    get:
      summary: Get list of users
      responses:
        '200':
          description: OK
  /projects:
    post:
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '201':
          description: Created
components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
